spring:
  application:
    name: employee-consumer
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/kafka_exp1_consumer}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    employee-topic: ${KAFKA_EMPLOYEE_TOPIC:employees.v1}
    consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:employee-service}
    dlt-consumer-group-id: ${KAFKA_DLT_CONSUMER_GROUP_ID:employee-dlt-service}
    concurrency: ${KAFKA_CONCURRENCY:5}
